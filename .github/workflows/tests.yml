name: CampusPulse regression tests
on:
  push:
  pull_request:
jobs:
  django-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies for isolated tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Django>=5.2,<5.3' 'djangorestframework>=3.16,<3.17' 'python-dotenv>=1.0,<2'
      - name: Source syntax check
        run: python -m compileall -q backend frontend scripts
      - name: SQLite API test suite (no MySQL writes)
        env:
          DB_ENGINE: sqlite
          DJANGO_SECRET_KEY: github-actions-only-non-production
        working-directory: backend
        run: python manage.py test monitor.tests -v 2
